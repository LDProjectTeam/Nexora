name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $site = Join-Path $PWD '_site'
          New-Item -ItemType Directory -Path $site | Out-Null
          $exclude = @('Build-Website.ps1', 'Serve-Website.ps1', 'README.md')
          Get-ChildItem website -File | Where-Object { $_.Name -notin $exclude } | Copy-Item -Destination $site
          Copy-Item website/assets -Destination (Join-Path $site 'assets') -Recurse
          New-Item -ItemType File -Path (Join-Path $site '.nojekyll') | Out-Null

          # The installer is not stored in the repository. Point the download
          # section at the latest published release asset when one exists.
          $manifestPath = Join-Path $site 'releases.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.current.installer = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest"

          # releases/latest can briefly point at the previous release right after a
          # new one is published, so the release event payload is authoritative.
          $release = $null
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:GITHUB_EVENT_PATH) {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $release = $event.release
          } else {
            $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
            if ($LASTEXITCODE -eq 0 -and $releaseJson) {
              $release = $releaseJson | ConvertFrom-Json
            }
          }

          if ($release) {
            $asset = $release.assets | Where-Object { $_.name -like 'Vellum-Setup-*-win-x64.exe' } | Select-Object -First 1
            if ($asset) {
              $manifest.current.installer = $asset.browser_download_url
              $manifest.current.filename = $asset.name
              $manifest.current.sizeBytes = $asset.size
              $manifest.current.fileModifiedUtc = $release.published_at
              $manifest.current.releaseDate = $release.published_at
              if ($asset.name -match 'Vellum-Setup-([0-9]+\.[0-9]+\.[0-9]+)-win-x64\.exe') {
                $manifest.current.version = $Matches[1]
              }
            }
            $downloadPatterns = [ordered]@{
              installer = 'Vellum-Setup-*-win-x64.exe'
              msi = 'Vellum-*-win-x64.msi'
              portable = 'Vellum-Portable-*-win-x64.zip'
              migrator = 'Vellum-Migrator.exe'
              checksums = 'SHA256SUMS.txt'
            }
            $downloads = [ordered]@{}
            foreach ($key in $downloadPatterns.Keys) {
              $matchedAsset = $release.assets | Where-Object { $_.name -like $downloadPatterns[$key] } | Select-Object -First 1
              if ($matchedAsset) {
                $downloads[$key] = [pscustomobject]@{
                  filename = $matchedAsset.name
                  sizeBytes = $matchedAsset.size
                  url = $matchedAsset.browser_download_url
                }
              }
            }
            $manifest.current | Add-Member -NotePropertyName downloads -NotePropertyValue $downloads -Force
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content $manifestPath -Encoding utf8

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
