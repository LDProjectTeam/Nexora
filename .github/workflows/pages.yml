name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $site = Join-Path $PWD '_site'
          New-Item -ItemType Directory -Path $site | Out-Null
          Copy-Item website/index.html, website/styles.css, website/script.js, website/nexora.ico, website/releases.json -Destination $site
          Copy-Item website/assets -Destination (Join-Path $site 'assets') -Recurse
          New-Item -ItemType File -Path (Join-Path $site '.nojekyll') | Out-Null

          # The installer is not stored in the repository. Point the download
          # section at the latest published release asset when one exists.
          $manifestPath = Join-Path $site 'releases.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.current.installer = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -like 'Nexora-Setup-*-win-x64.exe' } | Select-Object -First 1
            if ($asset) {
              $manifest.current.installer = $asset.browser_download_url
              $manifest.current.filename = $asset.name
              $manifest.current.sizeBytes = $asset.size
              $manifest.current.fileModifiedUtc = $release.published_at
              $manifest.current.releaseDate = $release.published_at
              if ($asset.name -match 'Nexora-Setup-([0-9]+\.[0-9]+\.[0-9]+)-win-x64\.exe') {
                $manifest.current.version = $Matches[1]
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content $manifestPath -Encoding utf8

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
